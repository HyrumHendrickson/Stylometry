# Pipeline configuration. All values shown are the defaults.

[corpus]
# Only files with this extension inside each author folder are read.
file_extension = ".txt"
# "utf-8-sig" reads UTF-8 and silently drops a leading byte-order mark.
encoding = "utf-8-sig"
# Every author needs at least 2 texts. Authors below this number trigger a warning
# because within-author statistics are unreliable with so few samples.
min_texts_per_author = 3

[stability]
# Step 3 picks the smallest list length K such that the intersection of every author's
# top-K most stable words contains at least this many words.
target_shared_words = 30

[distance]
# Primary metric used for the distance matrix and the report:
#   fisher     - Fisher-weighted standardized distance on square-root frequencies
#   delta      - Burrows's Delta (mean absolute z-score difference)
#   euclidean  - plain Euclidean distance on square-root frequencies
#   cosine     - cosine distance on raw relative frequencies
metric = "fisher"
# Metric the report compares the primary metric against (attribution accuracy).
baseline_metric = "delta"
# Numerical floor for within-author variances (guards against division by zero).
variance_floor = 1e-12
